[project]
name = "xxn-universal-agent"
version = "0.1.0"
description = "A lightweight LLM amplifier runtime with planner, pipeline agents, memory, and verifier loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "certifi>=2024.0.0",
]

[project.scripts]
xxn-agent = "xxn_universal_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
